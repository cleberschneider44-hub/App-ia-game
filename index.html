<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Player 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen chat app. Header, game picker, scrolling feed, composer pinned at the bottom. Single dark look by choice. */
:root {
  --bg: #0d1220;
  --surface: #161c2e;
  --surface-2: #1e2640;
  --line: #2a3453;
  --fg: #eef1fa;
  --muted: #98a3c4;
  --coral: #ff6b5b;
  --coral-ink: #2a0a06;
  --teal: #2ee6c5;
  --teal-ink: #06231e;
  --gold: #ffc857;
  --danger: #ff8a8a;
  --font-display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    radial-gradient(520px 320px at 100% 0%, rgba(46, 230, 197, 0.10), transparent 70%),
    radial-gradient(480px 300px at 0% 100%, rgba(255, 107, 91, 0.09), transparent 70%);
  background-repeat: no-repeat;
  color: var(--fg);
  font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
button, input, textarea { font-family: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

.app {
  height: 100%;
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
}

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 38px; height: 38px; border-radius: 11px; background: var(--teal); color: var(--teal-ink); display: grid; place-items: center; flex: none; }
h1 { margin: 0; font: 700 20px/1 var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; }
.sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.tools { display: flex; align-items: center; gap: 8px; }
.switch {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); color: var(--fg);
  padding: 7px 11px; border-radius: 999px; font-size: 12px; font-weight: 500;
}
.switch i { width: 28px; height: 16px; border-radius: 999px; background: var(--line); position: relative; transition: background 0.2s; flex: none; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: left 0.2s, background 0.2s; }
.switch[aria-checked="true"] i { background: var(--teal); }
.switch[aria-checked="true"] i::after { left: 14px; background: var(--teal-ink); }
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); color: var(--muted);
}
.icon-btn:hover { color: var(--fg); border-color: var(--muted); }

/* Game picker */
.gamebar { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 8px; }
.gamebar > * { min-width: 0; }
.eyebrow { font: 500 11px var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--teal); }
#game {
  width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; font-size: 16px;
}
#game::placeholder { color: var(--muted); }
#game:focus { border-color: var(--teal); outline: none; }
#game.pulse { animation: pulse 0.6s; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; cursor: pointer; background: transparent; color: var(--muted);
  border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500;
}
.chip:hover { color: var(--fg); border-color: var(--muted); }
.chip.active { background: var(--coral); border-color: var(--coral); color: var(--coral-ink); }

/* Feed */
.feed { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 4px 0; scroll-behavior: smooth; }
.msg { display: flex; gap: 8px; }
.msg.user { justify-content: flex-end; }
.avatar { width: 30px; height: 30px; border-radius: 9px; background: var(--teal); color: var(--teal-ink); display: grid; place-items: center; flex: none; margin-top: 2px; }
.bubble { padding: 10px 14px; border-radius: 16px; max-width: 88%; min-width: 0; overflow-wrap: anywhere; }
.user .bubble { background: var(--coral); color: var(--coral-ink); border-bottom-right-radius: 5px; font-weight: 500; white-space: pre-wrap; }
.bot .bubble { background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 5px; }
.bot .bubble.err { border-color: var(--danger); color: var(--danger); }
.bubble p { margin: 0 0 8px; }
.bubble ul, .bubble ol { margin: 0 0 8px; padding-left: 20px; }
.bubble li { margin-bottom: 3px; }
.bubble > :last-child { margin-bottom: 0; }
.bubble strong { color: var(--gold); font-weight: 600; }
.bubble code { font: 500 13px var(--font-mono); background: var(--surface-2); padding: 1px 6px; border-radius: 6px; }
.dots { display: inline-flex; gap: 4px; padding: 5px 0; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.1s infinite; }
.dots i:nth-child(2) { animation-delay: 0.15s; }
.dots i:nth-child(3) { animation-delay: 0.3s; }

/* Welcome */
.welcome { margin: auto 0; display: grid; gap: 14px; padding: 8px 0; }
.welcome h2 { margin: 0; font: 700 clamp(26px, 8vw, 34px)/1.1 var(--font-display); text-wrap: balance; }
.welcome p { margin: 0; color: var(--muted); max-width: 46ch; }
.sugg-list { display: grid; gap: 8px; }
.sugg {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); color: var(--fg);
  padding: 13px 14px; border-radius: 14px; font-size: 15px; font-weight: 500;
}
.sugg:hover { border-color: var(--teal); }
.sugg svg { flex: none; color: var(--teal); }

/* Composer */
.composer { display: flex; align-items: flex-end; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 7px; }
.composer:focus-within { border-color: var(--teal); }
#q { flex: 1; min-width: 0; resize: none; background: transparent; border: 0; outline: none; color: var(--fg); font-size: 16px; line-height: 1.4; padding: 9px 8px; max-height: 140px; }
#q::placeholder { color: var(--muted); }
.mic, .send { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; cursor: pointer; border: 0; flex: none; }
.mic { background: var(--surface-2); color: var(--fg); }
.mic.on { background: var(--coral); color: var(--coral-ink); animation: glow 1.2s infinite; }
.send { background: var(--coral); color: var(--coral-ink); }
.send:disabled { opacity: 0.4; cursor: default; }
.note { font-size: 12px; color: var(--muted); text-align: center; margin-top: -4px; }

@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
@keyframes pulse { 0%, 100% { border-color: var(--line); } 50% { border-color: var(--coral); box-shadow: 0 0 0 4px rgba(255, 107, 91, 0.25); } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 107, 91, 0.5); } 50% { box-shadow: 0 0 0 8px rgba(255, 107, 91, 0); } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
@media (max-width: 380px) { .sub { display: none; } }

html { background: #0d1220; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h4M8 9v4"/><circle cx="15.5" cy="10.5" r=".6"/><circle cx="17.5" cy="12.5" r=".6"/><path d="M7.5 6h9A4.5 4.5 0 0 1 21 10.5v3a3.5 3.5 0 0 1-6 2.5l-1-1h-4l-1 1a3.5 3.5 0 0 1-6-2.5v-3A4.5 4.5 0 0 1 7.5 6z"/></svg>
      </div>
      <div>
        <h1>Player 2</h1>
        <div class="sub">Seu parceiro de jogo com IA</div>
      </div>
    </div>
    <div class="tools">
      <button type="button" class="switch" id="spoil" role="switch" aria-checked="true"><i></i><span>Sem spoilers</span></button>
      <button type="button" class="icon-btn" id="reset" aria-label="Nova conversa" title="Nova conversa">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>
      </button>
    </div>
  </header>

  <section class="gamebar">
    <label class="eyebrow" for="game">Jogando agora</label>
    <input id="game" type="text" autocomplete="off" placeholder="Digite o nome do jogo" maxlength="80">
    <div class="chips" id="chips"></div>
  </section>

  <main class="feed" id="feed" aria-live="polite"></main>

  <form class="composer" id="form">
    <label for="q" hidden>Sua pergunta</label>
    <textarea id="q" rows="1" placeholder="Pergunte sobre o jogo…" maxlength="1000"></textarea>
    <button type="button" class="mic" id="mic" aria-label="Falar a pergunta" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button type="submit" class="send" id="send" aria-label="Enviar pergunta">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
  <div class="note" id="note" hidden></div>
</div>
<script src="/app.js"></script>
</body>
</html>
